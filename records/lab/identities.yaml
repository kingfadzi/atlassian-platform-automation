# Accounts with organisation or site administration, automation, or emergency access on this
# tenant. Per-tenant, so it lives here rather than in policy; what each `kind` may hold is in
# policy/identities.yaml. Anything with admin power that is not listed here is a finding.
# `id` is the Atlassian account id, `reviewed` is RFC 3339 and the window is in foundation.yaml.
#
# These ids match envs/lab/lab.tfvars, which is a template rather than a real tenant. A real
# environment's records live outside Git and carry its real account ids.
accounts:
  - id: USER-LAB-ADMIN
    kind: human_admin
    owner: PLATFORM-GOV
    scope: organisation and site administration (lab)
    reviewed: 2026-10-20T00:00:00Z
  - id: USER-LAB-ENGINE
    kind: engine
    owner: PLATFORM-GOV
    scope: pipeline principal; scoped tokens per stage; no interactive login
    reviewed: 2026-10-20T00:00:00Z
  - id: USER-LAB-BREAKGLASS
    kind: emergency
    owner: PLATFORM-GOV
    scope: sealed credentials; use raises a finding
    reviewed: 2026-10-20T00:00:00Z
