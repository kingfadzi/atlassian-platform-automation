# Structural rules for what the engine provisions. Read by HCL that applies them; change a rule
# here, not in HCL. Instance rules (what a project or space must satisfy) are policy/conformance.yaml.
version: 2026-10
owner: PLATFORM-GOV

standard_id_pattern: "^[a-z0-9-]+-v[0-9]+$"   # standards are versioned files in policy/standards
role_name_template: "platform-{role}"          # site-wide Jira project role names provisioned by the foundation
