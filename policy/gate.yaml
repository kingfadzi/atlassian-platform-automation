# Governance gate over Terraform plan JSON. Change rules here, not in Python.
actions:
  allowed: [no-op, read, create]      # creation only; the platform never updates or deletes
  blocked: [update, delete, replace]  # any of these fails the gate
  refuse_import: true                 # the platform creates its own objects; it never adopts an existing one
drift:
  delete_blocks: true                 # object vanished (or its read failed): stop, do not recreate
  report_fields: [api_data, api_response]  # refresh noise, reported only
checks:
  failures_block: true                # failed check blocks (drift, probes, tenancy) stop the apply
  report_prefix: report_              # checks named report_* are findings, never blockers
review:
  reviewer_must_not_be_admin: true
  plan_digest: sha256
policy_files:                         # hashed into every ledger entry so decisions stay explainable
  - policy/gate.yaml
  - policy/phases.yaml
  - policy/foundation.yaml
  - policy/intent_rules.yaml
  - policy/identities.yaml
  - policy/unchecked.yaml
  - policy/conformance.yaml
  - policy/treatment.yaml
  - policy/standards                  # a directory: every standard file is hashed
