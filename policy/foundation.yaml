# Shared foundation controls (lifecycle stage "establish the shared foundation").
#
# Each control names a FACT the foundation stage knows how to observe (vocabulary at the top of
# stages/foundation/facts.tf) and a REQUIREMENT placed on it. Change requirements here; HCL only
# changes when a genuinely new fact is needed.
#
# require.op is one of eight comparisons and the set is a ceiling, not a starting point:
#   equals                         fact.value == value
#   empty                          length(fact.value) == 0
#   at_least                       fact.value >= value
#   within_days                    fact.value is a timestamp newer than now - value days
#   manually_confirmed_within_days a manual confirmation carrying this control's id, recorded within value days
#   superset_of                    every element of value is in fact.value
#   subset_of                      every element of fact.value is in value
#   contains                       fact.value (string) contains value
# value_from names a path in the intent's `foundation` object instead of a literal value; when it
# resolves to an empty list the control is not_applicable (the intent has nothing to require).
#
# provision says who makes the setting true (docs/runbook-foundation.md lists the runbook steps):
#   engine    the foundation stage provisions it from policy (stages/foundation/provision.tf)
#   runbook   admin console only; a named operator does it once and records a manual confirmation
#   external  owned by another system (identity provider, AD, ServiceNow); verified only
#
# mandatory: true blocks the dependent products until satisfied; false is reported only.
# lab: not_applicable marks controls outside the personal lab's plan or scope.
# unknown (fact unreadable) counts as unsatisfied for a mandatory control.

version: 2026-10
owner: PLATFORM-GOV

controls:
  # Mandatory core for the lab
  - id: anonymous_jira_closed
    phase: guardrails
    title: Anonymous Jira access closed
    register: [SSCF-EXP-01]
    effective_from: 2026-10-20
    provision: runbook
    where: "Jira > Settings > Issues > Permission schemes, and System > General configuration"
    todo: "Remove anonymous access: no scheme may grant Browse Projects to Anyone, and no project may be shared publicly."
    mandatory: true
    depends: [jira]
    fact: anonymous_jira_projects
    require: { op: equals, value: 0 }

  - id: anonymous_confluence_closed
    phase: guardrails
    title: Anonymous Confluence access closed
    register: [SSCF-EXP-01]
    effective_from: 2026-10-20
    provision: runbook
    where: "Confluence > Settings > Global permissions, and each space's permissions"
    todo: "Remove the anonymous user from global and space permissions so no space is readable without signing in."
    mandatory: true
    depends: [confluence]
    fact: anonymous_confluence_spaces
    require: { op: equals, value: 0 }

  - id: no_public_scheme_grants
    phase: guardrails
    title: No permission scheme grants to anyone on the internet
    register: [SSCF-EXP-01, SSCF-ACC-03]
    effective_from: 2026-10-20
    provision: runbook
    where: "Jira > Settings > Issues > Permission schemes"
    todo: "Remove every grant whose holder is Anyone from every scheme; the engine's own schemes never carry one."
    mandatory: true
    depends: [jira]
    fact: scheme_grants_to_anyone
    require: { op: empty }

  - id: audit_collection_live
    phase: guardrails
    title: Organisation audit collection live
    register: [SSCF-LOG-01]
    effective_from: 2026-10-20
    provision: external
    mandatory: true
    depends: [jira, confluence]
    fact: latest_org_audit_event
    require: { op: within_days, value: 7 }

  - id: public_links_off
    phase: guardrails
    title: Public links and external sharing off
    register: [SSCF-EXP-02]
    effective_from: 2026-10-20
    provision: runbook
    where: "Confluence > Settings > Further configuration, and admin.atlassian.com > Security"
    todo: "Turn off public links and anonymous external sharing, then record the manual confirmation: this setting has no read API."
    mandatory: true
    depends: [confluence]
    fact: manual_confirmation
    require: { op: manually_confirmed_within_days, value: 90 }

  # Reported only in the lab
  - id: no_sitewide_browse_grants
    phase: guardrails
    title: No scheme grants BROWSE_PROJECTS to every licensed user
    provision: runbook
    where: "Jira > Settings > Issues > Permission schemes"
    todo: "Remove grants of Browse Projects to an application role, which would give every licensed user access."
    mandatory: false
    depends: [jira]
    fact: scheme_browse_for_all_licensed
    require: { op: empty }

  - id: product_access_by_group
    phase: identity
    title: Default product access groups are the declared ones
    provision: runbook
    where: "admin.atlassian.com > Product access"
    todo: "Make the default access groups the ones declared in foundation.product_access_groups, and remove the rest."
    mandatory: false
    depends: [jira]
    fact: default_access_groups
    require: { op: subset_of, value_from: foundation.product_access_groups }

  # Mandatory: Guard manages only accounts whose address sits in a verified domain, so a declared
  # domain that is not verified leaves those accounts unmanaged. An empty declaration requires
  # nothing, so this is inert until the tenant names its domains.
  - id: verified_domains_known
    phase: identity
    title: Verified domains include those in the intent
    provision: external
    effective_from: 2026-10-30
    mandatory: true
    depends: [jira, confluence]
    fact: verified_domains
    require: { op: superset_of, value_from: foundation.domains }

  # Verification is a standing dependency on a TXT record owned by whoever runs the zone, which
  # Atlassian says to keep permanently. claim.status above only moves once Atlassian re-checks,
  # so read DNS directly: a removed record is reported here before verified_domains_known fails.
  - id: domain_verification_record_present
    phase: identity
    title: Domain verification records still resolve in DNS
    provision: external
    where: "the DNS zone of each domain in foundation.domains, with the team that owns it"
    todo: "Restore the atlassian-domain-verification TXT record. It must stay in place permanently, not only until verification first completes."
    effective_from: 2026-10-30
    mandatory: false
    depends: [jira, confluence]
    fact: domains_missing_verification_record
    require: { op: empty }

  - id: domain_claimed_by_one_org
    phase: identity
    title: No second organisation has verified these domains
    provision: external
    where: "admin.atlassian.com > Settings > Domains"
    todo: "Find which other organisation claims the domain and have the claim removed; a second claim lets another tenant manage accounts in it."
    effective_from: 2026-10-30
    mandatory: false
    depends: [jira, confluence]
    fact: domains_claimed_by_other_orgs
    require: { op: empty }

  # Placement, two controls on one fact. The first catches a tenant that no longer matches what
  # the environment declared; the second catches an environment using a realm it is not permitted.
  # Only the first reads intent, so editing intent cannot satisfy the second.
  - id: product_placement_matches_intent
    phase: tenancy
    title: Product residency realms match the declared tenant
    provision: external
    effective_from: 2026-10-30
    mandatory: true
    depends: [jira, confluence]
    fact: product_realms
    require: { op: subset_of, value_from: foundation.approved_realms }

  - id: product_placement_permitted
    phase: tenancy
    title: Product residency realms are permitted for this environment
    provision: external
    effective_from: 2026-10-30
    mandatory: true
    depends: [jira, confluence]
    fact: product_realms
    require: { op: subset_of, value_from: policy.permitted_realms }

  - id: confluence_audit_retention
    phase: guardrails
    title: Confluence audit retention meets the minimum
    provision: runbook
    where: "Confluence > Settings > Audit log > retention"
    todo: "Raise the retention period to at least the window the control requires."
    mandatory: false
    depends: [confluence]
    fact: confluence_audit_retention_days
    require: { op: at_least, value: 365 }

  - id: announcement_banner
    phase: guardrails
    title: Announcement banner declares the governed estate
    provision: runbook
    where: "Jira > Settings > System > Announcement banner"
    todo: "Enable the banner and include the text declared in foundation.banner_contains."
    mandatory: false
    depends: [jira]
    fact: announcement_banner_text
    require: { op: contains, value_from: foundation.banner_contains }

  - id: evidence_retrieval
    phase: readiness
    title: Evidence retrieval from the ledger destination
    provision: runbook
    where: "the evidence destination, once one is chosen"
    todo: "Confirm a ledger entry can be retrieved by someone outside the platform team, then record the manual confirmation."
    mandatory: false
    depends: [jira, confluence]
    fact: manual_confirmation
    require: { op: manually_confirmed_within_days, value: 90 }
    lab: not_applicable      # no evidence destination chosen yet

  - id: self_signup_off
    phase: identity
    title: Self-signup and approved-domain signup off
    provision: runbook
    where: "admin.atlassian.com > Settings > User management"
    todo: "Turn off self-signup and approved-domain signup so accounts arrive only through the identity provider, then record the manual confirmation."
    mandatory: false
    depends: [jira, confluence]
    fact: manual_confirmation
    require: { op: manually_confirmed_within_days, value: 90 }

  - id: authentication_policy
    phase: identity
    title: Authentication policy, SSO and SCIM
    provision: external
    mandatory: false
    depends: [jira, confluence]
    fact: manual_confirmation
    require: { op: manually_confirmed_within_days, value: 90 }
    lab: not_applicable      # Atlassian Guard, outside the lab plan

  - id: alert_routing_tested
    phase: guardrails
    title: Alert routing to responders tested
    provision: runbook
    where: "the alerting destination and its on-call route"
    todo: "Send a test alert and confirm a responder receives it, then record the manual confirmation: there is no API for this."
    mandatory: false
    depends: [jira, confluence]
    fact: manual_confirmation
    require: { op: manually_confirmed_within_days, value: 90 }
    lab: not_applicable      # no SIEM in the lab

  # Entitlement (reported): which controls the plan can carry. Several runbook steps (restricting
  # space creation, granular permissions, IP allowlists, audit retention) need a paid plan. A
  # failing entitlement control explains why a runbook step cannot be completed; never confirm a
  # step the plan does not allow. Flip to mandatory for a firm tenant.
  - id: jira_plan_paid
    phase: tenancy
    title: At least one Jira application is on a paid plan (Free cannot restrict global permissions)
    provision: external
    mandatory: false
    depends: [jira]
    fact: jira_paid_application_count
    require: { op: at_least, value: 1 }

  - id: confluence_plan_above_free
    phase: tenancy
    title: Confluence seat capacity above the Free tier (inferred from the admin API; Confluence has no plan API)
    provision: external
    mandatory: false
    depends: [confluence]
    fact: confluence_seat_capacity
    require: { op: at_least, value_from: foundation.confluence_free_seats_plus_one }

  # Provisioned foundation (Cloud Foundation B and F): the engine creates these from policy and
  # then reads them back like any other fact.
  - id: roles_match_standards
    phase: standards
    title: Site-wide Jira project roles exist for every role the standards declare
    register: [SSCF-ACC-03]
    provision: engine
    mandatory: true
    depends: [jira]
    fact: jira_project_roles
    require: { op: superset_of, value_from: policy.role_names }

  - id: scheme_per_standard_present
    phase: standards
    title: One permission scheme per standard, granting to roles
    register: [SSCF-ACC-03]
    provision: engine
    mandatory: true
    depends: [jira]
    fact: permission_scheme_names
    require: { op: superset_of, value_from: policy.scheme_names }

  - id: scheme_grants_match_standards
    phase: standards
    title: Every grant a standard declares is present in its scheme (detects grants removed out of band)
    register: [SSCF-ACC-03]
    provision: engine
    mandatory: true
    depends: [jira]
    fact: scheme_grants
    require: { op: superset_of, value_from: policy.scheme_grants }

  - id: confluence_space_roles_present
    phase: standards
    title: Confluence default space roles available on the site
    provision: external          # Atlassian feature rollout; nothing to configure
    mandatory: true
    depends: [confluence]
    fact: confluence_space_roles
    require: { op: superset_of, value_from: policy.space_role_names }

  # Native creation closed (Cloud Foundation C): console only, no public write API.
  # Global permission grants have no read API, but the bulk permission check answers for any
  # account id, so the engine asks Jira what each declared account actually holds and compares it
  # with what its kind is allowed (policy/identities.yaml `kinds`). This subsumes project
  # creation: CREATE_PROJECT simply is not in the list for a kind that may not create projects.
  - id: account_global_permissions
    phase: guardrails
    title: Declared accounts hold only the global permissions their kind allows
    register: [SSCF-ACC-03]
    provision: runbook
    where: "Jira > Settings > System > Global permissions"
    todo: "Remove the reported account from the groups granting that permission; what each kind may hold is policy/identities.yaml."
    mandatory: true
    depends: [jira]
    fact: accounts_holding_disallowed_permissions
    require: { op: empty }

  - id: native_space_creation_closed
    phase: guardrails
    title: Only the engine can create Confluence spaces (Create Space held by the engine group)
    register: [SSCF-ACC-03]
    provision: runbook
    where: "Confluence > Settings > Global permissions"
    todo: "Grant Create space to the engine's group only and remove it from confluence-users and any other group, then record the manual confirmation."
    mandatory: true
    depends: [confluence]
    fact: manual_confirmation
    require: { op: manually_confirmed_within_days, value: 90 }

  # Exceptional identities (Cloud Foundation B).
  - id: admins_are_listed
    phase: identity
    title: Every account holding organisation or site administration is declared in records/<env>/identities.yaml
    register: [SSCF-ACC-01]
    provision: external          # memberships come from the directory
    mandatory: true
    depends: [jira, confluence]
    fact: site_admin_accounts
    require: { op: subset_of, value_from: policy.admin_accounts }

  - id: exceptional_identities_reviewed
    phase: identity
    title: Exceptional identities reviewed within the window
    register: [SSCF-ACC-01]
    provision: runbook
    where: "records/<env>/identities.yaml"
    todo: "Review each account's owner and scope, update reviewed for those still justified, and remove the rest along with their access."
    mandatory: true
    depends: [jira, confluence]
    fact: exceptional_identities_last_review
    require: { op: within_days, value: 90 }

  # Asset-treatment service (Asset Ownership and Treatment; policy/treatment.yaml). Readiness
  # dimension `treatment`; nothing depends on it yet.
  - id: treatment_project_present
    phase: intake
    title: The asset-treatment service project exists as a service desk
    provision: engine
    mandatory: true
    depends: [treatment]
    fact: service_project_keys
    require: { op: superset_of, value_from: policy.treatment_project_keys }

  - id: asset_issue_type_present
    phase: intake
    title: The Asset issue type exists
    provision: engine
    mandatory: true
    depends: [treatment]
    fact: issue_type_names
    require: { op: superset_of, value_from: policy.asset_issue_type }

  - id: asset_fields_present
    phase: intake
    title: Every Asset record field exists
    provision: engine
    mandatory: true
    depends: [treatment]
    fact: custom_field_names
    require: { op: superset_of, value_from: policy.asset_field_names }

  - id: request_types_present
    phase: intake
    title: Onboard, change, review and retire request types exist in the service
    provision: engine
    mandatory: true
    depends: [treatment]
    fact: treatment_request_types
    require: { op: superset_of, value_from: policy.request_type_names }

  - id: asset_workflow_built
    phase: intake
    title: Asset workflow built as declared in jsm/asset-workflow.yaml
    provision: runbook
    where: "the treatment project > Project settings > Workflows"
    todo: "Build the Asset workflow as jsm/asset-workflow.yaml describes: every status, and every transition with the declared from and to."
    mandatory: true
    depends: [treatment]
    fact: asset_workflow_gaps
    require: { op: empty }

  - id: automation_rules_imported
    phase: intake
    title: Automation rules imported as declared in jsm/automation-rules.json (bound to its file hash)
    provision: runbook
    where: "the treatment project > Project settings > Automation > Import rules"
    todo: "Import jsm/automation-rules.json, then record the file's sha256 as the import record."
    mandatory: true
    depends: [treatment]
    fact: import_current_automation_rules
    require: { op: equals, value: true }
