# What each kind of exceptional identity may hold (Cloud Foundation B). The accounts themselves
# are per-tenant and live in the environment's intent (foundation.accounts); this file says only which groups the
# foundation reads to find admins, and what a given kind of account is allowed to do.
version: 2026-10
owner: PLATFORM-GOV

admin_groups: [org-admins]                  # group memberships the foundation reads to find admins; a group that does not exist on the site leaves admins_are_listed unknown (fix the list, do not guess)

# Global permissions an account of each kind may hold. The engine asks Jira what each declared
# account actually holds and reports anything outside its kind's list. SYSTEM_ADMIN is allowed to
# no kind: nothing the platform runs needs it.
kinds:
  human_admin: [ADMINISTER, CREATE_PROJECT, CREATE_SHARED_OBJECTS, BULK_CHANGE, USER_PICKER]
  engine:      [ADMINISTER, CREATE_PROJECT]
  emergency:   [ADMINISTER, CREATE_PROJECT, CREATE_SHARED_OBJECTS, BULK_CHANGE, USER_PICKER]
