# Asset standard: restricted collaboration. Selected by governance.standard in the intent.
# A changed standard is a new file with `supersedes`; this file stays so assets admitted under it
# remain explainable. Modules carry no policy defaults; everything they grant comes from here.
#
# Roles are the fixed set every asset of this standard carries. Jira project roles are created
# once per site by the foundation; the permission scheme below grants to those roles and is also
# created once per standard by the foundation. Per asset only the role -> group binding varies.
id: restricted-collab-v1
title: Restricted collaboration asset (Jira project + Confluence space, role-scoped audience)
register: [SSCF-ACC-03, SSCF-EXP-01]
owner: PLATFORM-GOV
effective_from: 2026-10-20
supersedes: null

roles: [admin, lead, member, viewer]

jira:
  project_types: [software, business]
  scheme_name: "Platform restricted-collab-v1"
  role_permissions:
    admin:  [ADMINISTER_PROJECTS, BROWSE_PROJECTS, CREATE_ISSUES, EDIT_ISSUES, ADD_COMMENTS, CREATE_ATTACHMENTS, ASSIGNABLE_USER, MANAGE_SPRINTS]
    lead:   [BROWSE_PROJECTS, CREATE_ISSUES, EDIT_ISSUES, ADD_COMMENTS, CREATE_ATTACHMENTS, ASSIGNABLE_USER, MANAGE_SPRINTS]
    member: [BROWSE_PROJECTS, CREATE_ISSUES, EDIT_ISSUES, ADD_COMMENTS, CREATE_ATTACHMENTS, ASSIGNABLE_USER]
    viewer: [BROWSE_PROJECTS]
  assignee_type: UNASSIGNED

confluence:
  space_roles: { admin: Admin, lead: Manager, member: Collaborator, viewer: Viewer }
  audience_operations: [read]          # used until space role assignment replaces granular grants

lifecycle:                  # windows stages/estate applies to instances of this standard (days)
  inactive_days: 90         # no issue or page activity for this long: flagged
  abandoned_days: 180       # inactive this long, or no admin group bound: eligible for archive
  review_days: 365          # owner review due (JSM review request; phase 3)

description_template: "${business_authority} | ${standard} | ${classification} | managed by platform automation"

release:
  denied_status_codes: [401, 403, 404]
  anonymous_status_codes: [401, 403, 404]
