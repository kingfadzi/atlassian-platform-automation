$schema: https://json-schema.org/draft/2020-12/schema
title: Synthetic lab intent, not execution authority
type: object
additionalProperties: false
required: [environment, synthetic, profile, deletion_authorized, foundation, assets]
properties:
  environment: {const: lab}
  synthetic: {const: true}
  profile: {const: FS-COLLAB-01}
  deletion_authorized: {const: false}
  foundation:
    type: object
    additionalProperties: false
    required: [parameters, managed_properties]
    properties:
      parameters:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: "^P-(0[1-9]|1[0-9]|2[0-2])$"}
      managed_properties:
        $ref: "#/$defs/strings"
        items:
          enum: [identity_policy, sharing_policy, integration_policy, supported_data_placement, monitoring]
  assets:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/asset"}
$defs:
  strings:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  fixture_ref: {type: string, pattern: "^fixture:[a-z0-9-]+$"}
  asset:
    type: object
    additionalProperties: false
    required: [asset_key, kind, business_application_ref, requested_classification, audience_group_refs, authority_refs, managed_properties]
    properties:
      asset_key: {type: string, pattern: "^[a-z][a-z0-9-]+$"}
      kind: {enum: [jira_project, confluence_space]}
      management_type: {const: company_managed}
      initial_visibility: {const: private}
      business_application_ref: {type: string, minLength: 1}
      requested_classification: {enum: [Restricted, Confidential, Internal, Public]}
      audience_group_refs: {$ref: "#/$defs/strings"}
      authority_refs:
        type: object
        additionalProperties: false
        required: [application, ownership, classification, approval]
        properties:
          application: {$ref: "#/$defs/fixture_ref"}
          ownership: {$ref: "#/$defs/fixture_ref"}
          classification: {$ref: "#/$defs/fixture_ref"}
          approval: {$ref: "#/$defs/fixture_ref"}
      managed_properties: {$ref: "#/$defs/strings"}
    allOf:
      - if: {properties: {kind: {const: jira_project}}}
        then:
          required: [management_type]
          properties:
            managed_properties:
              items: {enum: [permission_scheme, project_roles, classification_default]}
      - if: {properties: {kind: {const: confluence_space}}}
        then:
          required: [initial_visibility]
          properties:
            managed_properties:
              items: {enum: [space_access, classification_default, public_link_restriction]}
